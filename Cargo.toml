[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "shopping-sessions"
path = "src/main.rs"

[features]
# Development-only sampling profiler, see src/prof.rs.
prof = []

[dependencies]
memmap2 = "0.9"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
